name: Preflight (full Meble-App)

# One full preflight on explicit approval: opened non-draft PR or Draft -> Ready.
# Never run full preflight on Draft creation, synchronize or main push.
on:
  pull_request:
    branches: ["main"]
    types: [opened, ready_for_review]
  workflow_dispatch: {}

concurrency:
  group: preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_sha: ${{ steps.revision.outputs.head_sha }}
      base_sha: ${{ steps.revision.outputs.base_sha }}
      status: ${{ steps.report.outputs.status }}
      reason: ${{ steps.report.outputs.reason }}
    steps:
      - name: Verify approved PR revision and state
        id: revision
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const refuse = reason => { core.setOutput('reason', reason); core.setFailed(reason); };
            if (!pr || !['opened','ready_for_review'].includes(context.payload.action) || pr.draft) return refuse('NO_APPROVED_READY_EVENT');
            if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) return refuse('FOREIGN_HEAD_REPOSITORY');
            try {
              const {data: current} = await github.rest.pulls.get({owner:context.repo.owner,repo:context.repo.repo,pull_number:pr.number});
              if (current.state !== 'open' || current.draft || current.merged) return refuse('PR_NOT_OPEN_READY');
              if (current.head.sha !== pr.head.sha) return refuse('APPROVED_HEAD_CHANGED');
              if (current.base.sha !== pr.base.sha || current.base.ref !== 'main' || pr.base.ref !== 'main') return refuse('APPROVED_BASE_CHANGED');
              const {data: main} = await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/main'});
              if (main.object.sha !== pr.base.sha) return refuse('MAIN_CHANGED');
              core.setOutput('head_sha', pr.head.sha);
              core.setOutput('base_sha', pr.base.sha);
            } catch (_) { return refuse('APPROVED_REVISION_READ_UNCONFIRMED'); }
      - name: Checkout exact approved head
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js 22
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated source and 425 pins
        id: source
        env:
          APPROVED_HEAD: ${{ steps.revision.outputs.head_sha }}
          APPROVED_BASE: ${{ steps.revision.outputs.base_sha }}
        run: node tools/cloud-ci-prepare.js "$APPROVED_HEAD"
      - name: Report group result
        id: report
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          GROUP_STEPS: ${{ toJSON(steps) }}
          REQUIRED_STEPS: revision,checkout,node,source
        with:
          script: |
            const steps = JSON.parse(process.env.GROUP_STEPS);
            const required = process.env.REQUIRED_STEPS.split(',');
            const failed = Object.entries(steps).filter(([,s]) => ['failure','cancelled'].includes(s.outcome));
            const missing = required.filter(id => steps[id]?.outcome !== 'success');
            const status = failed.length ? 'FAIL' : missing.length ? 'SKIPPED' : 'PASS';
            const reason = failed.length
              ? failed.map(([id,s]) => `${id}:${s.outcome}:${s.outputs?.reason || 'see step log'}`).join('; ')
              : missing.length ? `Required steps not executed: ${missing.join(', ')}` : 'All required steps passed';
            core.setOutput('status', status);
            core.setOutput('reason', reason);
            await core.summary.addHeading('Group diagnostics').addTable([
              [{data:'Step/group',header:true},{data:'Status',header:true},{data:'Reason',header:true}], ['Group',status,reason],
              ...required.map(id => [id,steps[id]?.outcome === 'success' ? 'PASS' : steps[id]?.outcome === 'failure' ? 'FAIL' : 'SKIPPED',steps[id]?.outputs?.reason || steps[id]?.outcome || 'No confirmed step result'])
            ]).write();


  preflight-static:
    needs: safety
    if: ${{ !cancelled() && needs.safety.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact approved head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.safety.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated source and 425 pins
        env:
          APPROVED_HEAD: ${{ needs.safety.outputs.head_sha }}
          APPROVED_BASE: ${{ needs.safety.outputs.base_sha }}
        run: node tools/cloud-ci-prepare.js "$APPROVED_HEAD"

      - name: Test preflight-static
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-logs"
          node tools/ci-budget-watch.js --label=preflight-static --warn-ms=75000 --target-ms=90000 -- node tools/preflight.js --current-only --static-only 2>&1 | tee "$RUNNER_TEMP/ci-logs/preflight-static.txt"
      - name: Upload preflight-static diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-preflight-static
          path: ${{ runner.temp }}/ci-logs/*.txt
          if-no-files-found: ignore

      - name: Audit module growth against approved BASE
        env:
          APPROVED_BASE: ${{ needs.safety.outputs.base_sha }}
        run: node tools/ci-module-growth.js

  preflight-shards:
    needs: safety
    if: ${{ !cancelled() && needs.safety.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact approved head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.safety.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated source and 425 pins
        env:
          APPROVED_HEAD: ${{ needs.safety.outputs.head_sha }}
          APPROVED_BASE: ${{ needs.safety.outputs.base_sha }}
        run: node tools/cloud-ci-prepare.js "$APPROVED_HEAD"
      - name: Inspect isolated browser runtime
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/bin/dbus-run-session
          test -x /usr/bin/python3
          browser_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -x "$browser_path"
          echo "CHROMIUM_PATH=$browser_path" >> "$GITHUB_ENV"
          "$browser_path" --version

      - name: Test smoke-shard-${{ matrix.shard }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-logs"
          node tools/ci-budget-watch.js --label=smoke-shard-${{ matrix.shard }} --warn-ms=75000 --target-ms=90000 -- node tools/preflight.js --current-only --smoke-shard=${{ matrix.shard }} 2>&1 | tee "$RUNNER_TEMP/ci-logs/smoke-shard-${{ matrix.shard }}.txt"
      - name: Upload smoke-shard-${{ matrix.shard }} diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-preflight-smoke-${{ matrix.shard }}
          path: ${{ runner.temp }}/ci-logs/*.txt
          if-no-files-found: ignore


  preflight:
    if: ${{ always() }}
    needs: [safety, preflight-static, preflight-shards]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      status: ${{ steps.report.outputs.status }}
      reason: ${{ steps.report.outputs.reason }}
    steps:
      - name: Aggregate mandatory preflight groups
        id: report
        uses: actions/github-script@v7
        env:
          GROUPS: ${{ toJSON(needs) }}
        with:
          script: |
            const groups=JSON.parse(process.env.GROUPS);
            const names=["safety","preflight-static","preflight-shards"];
            const missing=names.filter(name=>groups[name]?.result!=='success');
            const status=missing.length?'FAIL':'PASS';
            const reason=missing.length?'Mandatory groups not successful: '+missing.join(', '):'All mandatory groups passed';
            core.setOutput('status',status);
            core.setOutput('reason',reason);
            await core.summary.addHeading('preflight: '+status).addTable([
              [{data:'Group',header:true},{data:'Status',header:true}],
              ...names.map(name=>[name,groups[name]?.result||'missing'])
            ]).write();
            if(missing.length)core.setFailed(reason);


  firebase-current-shards:
    needs: safety
    if: ${{ !cancelled() && needs.safety.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        batch: [1, 2, 3]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact approved head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.safety.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated source and 425 pins
        env:
          APPROVED_HEAD: ${{ needs.safety.outputs.head_sha }}
          APPROVED_BASE: ${{ needs.safety.outputs.base_sha }}
        run: node tools/cloud-ci-prepare.js "$APPROVED_HEAD"
      - name: Inspect isolated browser runtime
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/bin/dbus-run-session
          test -x /usr/bin/python3
          browser_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -x "$browser_path"
          echo "CHROMIUM_PATH=$browser_path" >> "$GITHUB_ENV"
          "$browser_path" --version
      - name: Use Java 21 for DEMO emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked DEMO emulator dependencies
        shell: bash
        run: npm --prefix "$PREFLIGHT_DIR/tools/firebase-pilot" ci --no-audit --no-fund
      - name: Verify SDK source, pins and DEMO boundaries
        env:
          APPROVED_HEAD: ${{ needs.safety.outputs.head_sha }}
          APPROVED_BASE: ${{ needs.safety.outputs.base_sha }}
        run: node tools/cloud-ci-prepare.js --verify-sdk current

      - name: Test firebase-current-${{ matrix.batch }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-logs"
          node tools/ci-budget-watch.js --label=firebase-current-${{ matrix.batch }} --warn-ms=75000 --target-ms=90000 -- node tools/cloud-ci-emulators.js --context=current --batch=${{ matrix.batch }} 2>&1 | tee "$RUNNER_TEMP/ci-logs/firebase-current-${{ matrix.batch }}.txt"
      - name: Upload firebase-current-${{ matrix.batch }} diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-firebase-current-${{ matrix.batch }}
          path: ${{ runner.temp }}/ci-logs/*.txt
          if-no-files-found: ignore


  firebase-current:
    if: ${{ always() }}
    needs: [safety, firebase-current-shards]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      status: ${{ steps.report.outputs.status }}
      reason: ${{ steps.report.outputs.reason }}
    steps:
      - name: Aggregate mandatory firebase-current groups
        id: report
        uses: actions/github-script@v7
        env:
          GROUPS: ${{ toJSON(needs) }}
        with:
          script: |
            const groups=JSON.parse(process.env.GROUPS);
            const names=["safety","firebase-current-shards"];
            const missing=names.filter(name=>groups[name]?.result!=='success');
            const status=missing.length?'FAIL':'PASS';
            const reason=missing.length?'Mandatory groups not successful: '+missing.join(', '):'All mandatory groups passed';
            core.setOutput('status',status);
            core.setOutput('reason',reason);
            await core.summary.addHeading('firebase-current: '+status).addTable([
              [{data:'Group',header:true},{data:'Status',header:true}],
              ...names.map(name=>[name,groups[name]?.result||'missing'])
            ]).write();
            if(missing.length)core.setFailed(reason);


  cloud-historical-smoke:
    needs: safety
    if: ${{ !cancelled() && needs.safety.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact approved head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.safety.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated source and 425 pins
        env:
          APPROVED_HEAD: ${{ needs.safety.outputs.head_sha }}
          APPROVED_BASE: ${{ needs.safety.outputs.base_sha }}
        run: node tools/cloud-ci-prepare.js "$APPROVED_HEAD"

      - name: Test cloud-historical-smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-logs"
          node tools/ci-budget-watch.js --label=cloud-historical-smoke --warn-ms=75000 --target-ms=90000 -- node tools/cloud-ci-historical.js 2>&1 | tee "$RUNNER_TEMP/ci-logs/cloud-historical-smoke.txt"
      - name: Upload cloud-historical-smoke diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-cloud-historical-smoke
          path: ${{ runner.temp }}/ci-logs/*.txt
          if-no-files-found: ignore


  cloud-historical-sdk:
    needs: safety
    if: ${{ !cancelled() && needs.safety.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact approved head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.safety.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated source and 425 pins
        env:
          APPROVED_HEAD: ${{ needs.safety.outputs.head_sha }}
          APPROVED_BASE: ${{ needs.safety.outputs.base_sha }}
        run: node tools/cloud-ci-prepare.js "$APPROVED_HEAD"
      - name: Use Java 21 for DEMO emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked DEMO emulator dependencies
        shell: bash
        run: npm --prefix "$CLOUD_CI_HISTORY_ROOT/tools/firebase-pilot" ci --no-audit --no-fund
      - name: Verify SDK source, pins and DEMO boundaries
        env:
          APPROVED_HEAD: ${{ needs.safety.outputs.head_sha }}
          APPROVED_BASE: ${{ needs.safety.outputs.base_sha }}
        run: node tools/cloud-ci-prepare.js --verify-sdk historical

      - name: Test cloud-historical-sdk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-logs"
          node tools/ci-budget-watch.js --label=cloud-historical-sdk --warn-ms=75000 --target-ms=90000 -- node tools/cloud-ci-emulators.js --context=historical 2>&1 | tee "$RUNNER_TEMP/ci-logs/cloud-historical-sdk.txt"
      - name: Upload cloud-historical-sdk diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-cloud-historical-sdk
          path: ${{ runner.temp }}/ci-logs/*.txt
          if-no-files-found: ignore


  cloud-historical:
    if: ${{ always() }}
    needs: [safety, cloud-historical-smoke, cloud-historical-sdk]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      status: ${{ steps.report.outputs.status }}
      reason: ${{ steps.report.outputs.reason }}
    steps:
      - name: Aggregate mandatory cloud-historical groups
        id: report
        uses: actions/github-script@v7
        env:
          GROUPS: ${{ toJSON(needs) }}
        with:
          script: |
            const groups=JSON.parse(process.env.GROUPS);
            const names=["safety","cloud-historical-smoke","cloud-historical-sdk"];
            const missing=names.filter(name=>groups[name]?.result!=='success');
            const status=missing.length?'FAIL':'PASS';
            const reason=missing.length?'Mandatory groups not successful: '+missing.join(', '):'All mandatory groups passed';
            core.setOutput('status',status);
            core.setOutput('reason',reason);
            await core.summary.addHeading('cloud-historical: '+status).addTable([
              [{data:'Group',header:true},{data:'Status',header:true}],
              ...names.map(name=>[name,groups[name]?.result||'missing'])
            ]).write();
            if(missing.length)core.setFailed(reason);

  ci-summary:
    if: ${{ always() }}
    needs: [safety, preflight, firebase-current, cloud-historical]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      status: ${{ steps.summary.outputs.status }}
      reason: ${{ steps.summary.outputs.reason }}
    steps:
      - name: Aggregate all mandatory diagnostics
        id: summary
        uses: actions/github-script@v7
        env:
          GROUPS: ${{ toJSON(needs) }}
        with:
          script: |
            const groups = JSON.parse(process.env.GROUPS);
            const keys = ['safety','preflight','firebase-current','cloud-historical'];
            const rows = keys.map(key => {
              const job = groups[key] || {};
              const status = job.result === 'success' && job.outputs?.status === 'PASS' ? 'PASS'
                : ['skipped','cancelled'].includes(job.result) ? 'SKIPPED' : 'FAIL';
              const reason = status === 'PASS' ? 'All required steps passed'
                : job.outputs?.reason || (job.result === 'skipped'
                  ? `Safety prerequisites not satisfied: ${groups.safety?.outputs?.reason || groups.safety?.result || 'unknown'}`
                  : `Job/report ${job.result || 'unconfirmed'}; see job steps`);
              return [key,status,reason];
            });
            const pr = context.payload.pull_request;
            let identity = 'NO_APPROVED_READY_EVENT';
            if (pr && ['opened','ready_for_review'].includes(context.payload.action) && !pr.draft) {
              try {
                const {data: current} = await github.rest.pulls.get({owner:context.repo.owner,repo:context.repo.repo,pull_number:pr.number});
                const {data: main} = await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/main'});
                identity = current.state === 'open' && !current.draft && !current.merged
                  && current.head.sha === pr.head.sha && current.base.sha === pr.base.sha
                  && current.base.ref === 'main' && pr.base.ref === 'main'
                  && main.object.sha === pr.base.sha && pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`
                  ? 'PASS' : 'APPROVED_HEAD_BASE_OR_STATE_CHANGED';
              } catch (_) { identity = 'PR_IDENTITY_RECHECK_UNCONFIRMED'; }
            }
            const ready = rows.every(row => row[1] === 'PASS') && identity === 'PASS';
            const status = ready ? 'RELEASE_READY' : 'RELEASE_BLOCKED';
            const reason = ready ? 'All mandatory groups and exact revision passed'
              : rows.filter(row=>row[1]!=='PASS').map(row=>`${row[0]}: ${row[2]}`).concat(identity==='PASS'?[]:[identity]).join('; ');
            core.setOutput('status',status);
            core.setOutput('reason',reason);
            await core.summary.addHeading(status).addTable([
              [{data:'Group',header:true},{data:'Status',header:true},{data:'Reason',header:true}],...rows,
              ['Exact HEAD/BASE and PR state',identity==='PASS'?'PASS':'FAIL',identity]
            ]).addRaw(`\nHEAD: ${pr?.head?.sha || 'unconfirmed'}; BASE: ${pr?.base?.sha || 'unconfirmed'}; Firebase LIVE_BLOCKED.\n`).write();
            if (!ready) core.setFailed('RELEASE_BLOCKED: '+reason);

  auto-merge:
    if: ${{ needs.safety.result == 'success' && needs.preflight.result == 'success' && needs.firebase-current.result == 'success' && needs.cloud-historical.result == 'success' && needs.ci-summary.result == 'success' && needs.ci-summary.outputs.status == 'RELEASE_READY' && github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'ready_for_review') && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [safety, preflight, firebase-current, cloud-historical, ci-summary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      merge_sha: ${{ steps.merge.outputs.result }}

    steps:
      - name: Merge the exact tested PR head
        id: merge
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const pr = context.payload.pull_request;
            const current = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });

            // Returning to Draft revokes approval even after this workflow starts.
            if (current.data.draft || current.data.state !== 'open') {
              core.setFailed('PR is no longer open and Ready; refusing merge.');
              return '';
            }

            if (current.data.head.sha !== pr.head.sha) {
              core.setFailed(`PR head moved from ${pr.head.sha} to ${current.data.head.sha}; refusing stale merge.`);
              return '';
            }

            // Do not merge if main moved after the tested event.
            if (current.data.base.sha !== pr.base.sha || current.data.base.ref !== pr.base.ref || current.data.base.ref !== 'main') {
              core.setFailed(`PR base changed from ${pr.base.sha} to ${current.data.base.sha}; refusing untested merge.`);
              return '';
            }

            const result = await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              merge_method: 'merge',
              sha: pr.head.sha,
              commit_title: pr.title,
              commit_message: pr.title
            });

            if (!result.data.merged) {
              core.setFailed(`Auto-merge failed: ${result.data.message || 'unknown reason'}`);
              return '';
            }

            core.notice(`Merged as ${result.data.sha}`);
            return result.data.sha;

  post-merge-verify:
    if: ${{ github.event_name == 'pull_request' && needs.auto-merge.result == 'success' }}
    needs: auto-merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    # Lightweight deployment check only; full preflight already passed before merge.
    steps:
      - name: Wait for Pages on exact merge commit
        uses: actions/github-script@v7
        env:
          MERGE_SHA: ${{ needs.auto-merge.outputs.merge_sha }}
        with:
          script: |
            const mergeSha = process.env.MERGE_SHA;
            const maxAttempts = 60;
            const delayMs = 10000;

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: mergeSha,
                per_page: 100
              });

              const pagesRun = response.data.workflow_runs.find(
                run => run.name === 'pages build and deployment'
              );

              if (pagesRun) {
                core.info(`Pages run #${pagesRun.run_number}: ${pagesRun.status}/${pagesRun.conclusion || 'pending'}`);

                if (pagesRun.status === 'completed') {
                  if (pagesRun.conclusion === 'success') {
                    core.notice(`Pages succeeded for ${mergeSha}`);
                    return;
                  }

                  core.setFailed(`Pages finished with conclusion: ${pagesRun.conclusion}`);
                  return;
                }
              } else {
                core.info(`Waiting for Pages run for ${mergeSha} (attempt ${attempt}/${maxAttempts})`);
              }

              await new Promise(resolve => setTimeout(resolve, delayMs));
            }

            core.setFailed(`Timed out waiting for Pages for merge commit ${mergeSha}`);

  final-status:
    if: ${{ always() && github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'ready_for_review') && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [safety, preflight, firebase-current, cloud-historical, ci-summary, auto-merge, post-merge-verify]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Comment READY or BLOCKED on PR
        uses: actions/github-script@v7
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          PREFLIGHT_STATUS: ${{ needs.preflight.outputs.status }}
          FIREBASE_RESULT: ${{ needs.firebase-current.result }}
          FIREBASE_STATUS: ${{ needs.firebase-current.outputs.status }}
          HISTORICAL_RESULT: ${{ needs.cloud-historical.result }}
          HISTORICAL_STATUS: ${{ needs.cloud-historical.outputs.status }}
          SAFETY_RESULT: ${{ needs.safety.result }}
          SAFETY_STATUS: ${{ needs.safety.outputs.status }}
          DIAGNOSTIC_STATUS: ${{ needs.ci-summary.outputs.status }}
          DIAGNOSTIC_REASON: ${{ needs.ci-summary.outputs.reason }}
          MERGE_RESULT: ${{ needs.auto-merge.result }}
          VERIFY_RESULT: ${{ needs.post-merge-verify.result }}
          MERGE_SHA: ${{ needs.auto-merge.outputs.merge_sha }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const current = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });

            if (!current.data.merged && current.data.head.sha !== pr.head.sha) {
              await core.summary.addHeading('RELEASE_BLOCKED').addRaw('Stale HEAD: this run cannot confirm the current PR.').write();
              core.setFailed('RELEASE_BLOCKED: stale HEAD');
              core.notice('Stale workflow run detected; skipping final notification.');
              return;
            }

            const preflight = process.env.PREFLIGHT_RESULT;
            const merge = process.env.MERGE_RESULT;
            const verify = process.env.VERIFY_RESULT;
            const mergeSha = process.env.MERGE_SHA || '';

            const ready = preflight === 'success' && process.env.FIREBASE_RESULT === 'success' && process.env.HISTORICAL_RESULT === 'success' && process.env.SAFETY_RESULT === 'success' && process.env.DIAGNOSTIC_STATUS === 'RELEASE_READY' && ['PREFLIGHT_STATUS','FIREBASE_STATUS','HISTORICAL_STATUS','SAFETY_STATUS'].every(key=>process.env[key]==='PASS') && merge === 'success' && verify === 'success';
            const display = result => result === 'success' ? 'PASS' : ['skipped','cancelled'].includes(result) ? 'SKIPPED' : 'FAIL';
            const displayGroup = (result,status) => result === 'success' && status === 'PASS' ? 'PASS' : status === 'SKIPPED' || ['skipped','cancelled'].includes(result) ? 'SKIPPED' : 'FAIL';
            await core.summary.addHeading(ready ? 'RELEASE_READY' : 'RELEASE_BLOCKED').addTable([
              [{data:'Group',header:true},{data:'Status',header:true}],
              ['Source/425 pins',displayGroup(process.env.SAFETY_RESULT,process.env.SAFETY_STATUS)],
              ['Preflight',displayGroup(preflight,process.env.PREFLIGHT_STATUS)],['Current Firebase',displayGroup(process.env.FIREBASE_RESULT,process.env.FIREBASE_STATUS)],
              ['Historical CLOUD',displayGroup(process.env.HISTORICAL_RESULT,process.env.HISTORICAL_STATUS)],
              ['Auto-merge',display(merge)],['Pages for exact merge SHA',display(verify)]
            ]).addRaw(`\n${process.env.DIAGNOSTIC_REASON || 'No confirmed diagnostic report'}\nFirebase LIVE_BLOCKED.\n`).write();
            const body = ready
              ? [
                  '✅ **RELEASE_READY — wszystkie wymagane grupy, merge i Pages PASS.**',
                  '',
                  'Preflight / aktualne Firebase / historyczne CLOUD: **PASS**',
                  'Auto-merge: **OK**',
                  'Pages: **OK**',
                  mergeSha ? `Merge commit: \`${mergeSha}\`` : ''
                ].filter(Boolean).join('\n')
              : [
                  '❌ **RELEASE_BLOCKED — nie przechodź jeszcze do następnego etapu.**',
                  '',
                  `Preflight PR: **${displayGroup(preflight,process.env.PREFLIGHT_STATUS)}**`,
                  `Aktualne Firebase: **${displayGroup(process.env.FIREBASE_RESULT,process.env.FIREBASE_STATUS)}**`,
                  `Historyczne CLOUD: **${displayGroup(process.env.HISTORICAL_RESULT,process.env.HISTORICAL_STATUS)}**`,
                  `Bramka źródeł: **${displayGroup(process.env.SAFETY_RESULT,process.env.SAFETY_STATUS)}**`,
                  `Diagnostyka: **${process.env.DIAGNOSTIC_STATUS || 'RELEASE_BLOCKED'}** — ${process.env.DIAGNOSTIC_REASON || 'brak potwierdzonego raportu'}`,
                  `Auto-merge: **${merge}**`,
                  `Pages dla scalonego commita: **${verify}**`,
                  '',
                  'Trzeba sprawdzić nieudany etap w GitHub Actions.'
                ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body
            });

            core.notice(ready ? 'READY notification posted.' : 'BLOCKED notification posted.');
            if (!ready) core.setFailed('RELEASE_BLOCKED');
