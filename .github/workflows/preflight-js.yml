name: Preflight (full Meble-App)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Select site to test
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(ls -1t site*.zip 2>/dev/null | head -n 1 || true)"

          if [ -z "$ZIP" ]; then
            echo "No site*.zip found — testing current repository root."
            echo "PREFLIGHT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Using ZIP: $ZIP"
          rm -rf _preflight_raw _preflight_site
          mkdir -p _preflight_raw _preflight_site
          unzip -q "$ZIP" -d _preflight_raw

          if [ -f _preflight_raw/index.html ]; then
            cp -a _preflight_raw/. _preflight_site/
          else
            topdir="$(find _preflight_raw -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)"
            if [ -n "$topdir" ] && [ -f "$topdir/index.html" ]; then
              echo "Flattening top folder: $topdir"
              cp -a "$topdir"/. _preflight_site/
            fi
          fi

          if [ ! -f _preflight_site/index.html ]; then
            echo "ERROR: index.html not found after unzip/flatten."
            exit 1
          fi

          if [ ! -f _preflight_site/tools/preflight.js ]; then
            echo "ERROR: tools/preflight.js not found in tested package."
            exit 1
          fi

          echo "PREFLIGHT_DIR=$GITHUB_WORKSPACE/_preflight_site" >> "$GITHUB_ENV"

      - name: Run full Meble-App preflight
        shell: bash
        run: |
          set -uo pipefail

          echo "Testing: $PREFLIGHT_DIR"
          set +e
          node "$PREFLIGHT_DIR/tools/preflight.js" 2>&1 | tee preflight-output.txt
          status=${PIPESTATUS[0]}
          set -e

          {
            echo "## Meble-App preflight"
            echo
            echo '```text'
            tail -n 120 preflight-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

  auto-merge:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Merge the exact tested PR head
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const result = await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              merge_method: 'merge',
              sha: pr.head.sha,
              commit_title: pr.title,
              commit_message: pr.title
            });

            if (!result.data.merged) {
              core.setFailed(`Auto-merge failed: ${result.data.message || 'unknown reason'}`);
            }
