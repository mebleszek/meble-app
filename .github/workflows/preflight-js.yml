name: Preflight (full Meble-App)

# One full preflight on explicit approval: opened non-draft PR or Draft -> Ready.
# Never run full preflight on Draft creation, synchronize or main push.
on:
  pull_request:
    branches: ["main"]
    types: [opened, ready_for_review]
  workflow_dispatch: {}

concurrency:
  group: preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Inspect and select isolated browser runtime
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/bin/dbus-run-session
          test -x /usr/bin/python3
          browser_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -x "$browser_path"
          "$browser_path" --version
          echo "CHROMIUM_PATH=$browser_path" >> "$GITHUB_ENV"
          node -e 'console.log(JSON.stringify(require("./tools/helpers/chromium-runtime").resources()))'

      - name: Prepare exact isolated historical CLOUD source
        id: cloud-context
        shell: bash
        run: |
          set -euo pipefail
          history="$RUNNER_TEMP/meble-cloud-history"
          test ! -e "$history"
          sha="$(node -p "require('./tools/cloud-ci-context.js').HISTORICAL_SHA")"
          git clone --quiet --no-hardlinks --no-checkout --local "$GITHUB_WORKSPACE" "$history"
          git -C "$history" checkout --quiet --detach "$sha"
          CLOUD_CI_HISTORY_ROOT="$history" node <<'NODE'
          const c = require('./tools/cloud-ci-context.js');
          c.verifyHistorical(process.cwd());
          c.sdkPlan(process.cwd());
          const event = JSON.parse(require('node:fs').readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));
          if (event.pull_request) c.report(`Requested PR HEAD: \`${event.pull_request.head.sha}\`; BASE: \`${event.pull_request.base.sha}\`.`);
          c.report(`Current source SHA: \`${c.git(process.cwd(),['rev-parse','HEAD'])}\`; historical CLOUD evidence SHA: \`${c.HISTORICAL_SHA}\` (425 source pins verified). Historical PASS grants no authority to current source. Firebase LIVE_BLOCKED.`);
          NODE
          echo "CLOUD_CI_HISTORY_ROOT=$history" >> "$GITHUB_ENV"
          echo "PREFLIGHT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Run full Meble-App preflight
        id: full-preflight
        shell: bash
        run: |
          set -uo pipefail

          echo "Testing: $PREFLIGHT_DIR"
          set +e
          node "$PREFLIGHT_DIR/tools/preflight.js" 2>&1 | tee preflight-output.txt
          status=${PIPESTATUS[0]}
          set -e

          {
            echo "## Meble-App preflight"
            echo
            echo '```text'
            tail -n 120 preflight-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" -ne 0 ]; then
            echo 'SDK/Auth/Firestore/Rules: SKIPPED because Preflight failed — not PASS. Release BLOCKED.' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      # Same approval event, before the existing auto-merge dependency succeeds.
      # Emulator-only demo project; never login/deploy or read live Firebase.
      - name: Use Java 21 for Firebase emulators
        id: java
        if: ${{ !cancelled() && steps.full-preflight.outcome == 'success' && steps.cloud-context.outcome == 'success' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked emulator dependencies in both contexts
        id: emulator-deps
        if: ${{ !cancelled() && steps.full-preflight.outcome == 'success' && steps.java.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix "$PREFLIGHT_DIR/tools/firebase-pilot" ci --no-audit --no-fund
          npm --prefix "$CLOUD_CI_HISTORY_ROOT/tools/firebase-pilot" ci --no-audit --no-fund

      - name: Run mandatory current and historical SDK/Auth/Firestore/Rules
        id: sdk
        if: ${{ !cancelled() && steps.full-preflight.outcome == 'success' && steps.emulator-deps.outcome == 'success' }}
        shell: bash
        env:
          CI: '1'
        run: |
          set -euo pipefail
          node "$PREFLIGHT_DIR/tools/cloud-ci-emulators.js"

  auto-merge:
    if: ${{ needs.preflight.result == 'success' && github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'ready_for_review') && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      merge_sha: ${{ steps.merge.outputs.result }}

    steps:
      - name: Merge the exact tested PR head
        id: merge
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const pr = context.payload.pull_request;
            const current = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });

            // Returning to Draft revokes approval even after this workflow starts.
            if (current.data.draft || current.data.state !== 'open') {
              core.setFailed('PR is no longer open and Ready; refusing merge.');
              return '';
            }

            if (current.data.head.sha !== pr.head.sha) {
              core.setFailed(`PR head moved from ${pr.head.sha} to ${current.data.head.sha}; refusing stale merge.`);
              return '';
            }

            // Do not merge if main moved after the tested event.
            if (current.data.base.sha !== pr.base.sha) {
              core.setFailed(`PR base changed from ${pr.base.sha} to ${current.data.base.sha}; refusing untested merge.`);
              return '';
            }

            const result = await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              merge_method: 'merge',
              sha: pr.head.sha,
              commit_title: pr.title,
              commit_message: pr.title
            });

            if (!result.data.merged) {
              core.setFailed(`Auto-merge failed: ${result.data.message || 'unknown reason'}`);
              return '';
            }

            core.notice(`Merged as ${result.data.sha}`);
            return result.data.sha;

  post-merge-verify:
    if: ${{ github.event_name == 'pull_request' && needs.auto-merge.result == 'success' }}
    needs: auto-merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    # Lightweight deployment check only; full preflight already passed before merge.
    steps:
      - name: Wait for Pages on exact merge commit
        uses: actions/github-script@v7
        env:
          MERGE_SHA: ${{ needs.auto-merge.outputs.merge_sha }}
        with:
          script: |
            const mergeSha = process.env.MERGE_SHA;
            const maxAttempts = 60;
            const delayMs = 10000;

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: mergeSha,
                per_page: 100
              });

              const pagesRun = response.data.workflow_runs.find(
                run => run.name === 'pages build and deployment'
              );

              if (pagesRun) {
                core.info(`Pages run #${pagesRun.run_number}: ${pagesRun.status}/${pagesRun.conclusion || 'pending'}`);

                if (pagesRun.status === 'completed') {
                  if (pagesRun.conclusion === 'success') {
                    core.notice(`Pages succeeded for ${mergeSha}`);
                    return;
                  }

                  core.setFailed(`Pages finished with conclusion: ${pagesRun.conclusion}`);
                  return;
                }
              } else {
                core.info(`Waiting for Pages run for ${mergeSha} (attempt ${attempt}/${maxAttempts})`);
              }

              await new Promise(resolve => setTimeout(resolve, delayMs));
            }

            core.setFailed(`Timed out waiting for Pages for merge commit ${mergeSha}`);

  final-status:
    if: ${{ always() && github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'ready_for_review') && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [preflight, auto-merge, post-merge-verify]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Comment READY or BLOCKED on PR
        uses: actions/github-script@v7
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          MERGE_RESULT: ${{ needs.auto-merge.result }}
          VERIFY_RESULT: ${{ needs.post-merge-verify.result }}
          MERGE_SHA: ${{ needs.auto-merge.outputs.merge_sha }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const current = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });

            if (!current.data.merged && current.data.head.sha !== pr.head.sha) {
              core.notice('Stale workflow run detected; skipping final notification.');
              return;
            }

            const preflight = process.env.PREFLIGHT_RESULT;
            const merge = process.env.MERGE_RESULT;
            const verify = process.env.VERIFY_RESULT;
            const mergeSha = process.env.MERGE_SHA || '';

            const ready = preflight === 'success' && merge === 'success' && verify === 'success';
            const body = ready
              ? [
                  '✅ **READY — można przejść do następnego etapu.**',
                  '',
                  'Preflight PR: **OK**',
                  'Auto-merge: **OK**',
                  'Pages: **OK**',
                  mergeSha ? `Merge commit: \`${mergeSha}\`` : ''
                ].filter(Boolean).join('\n')
              : [
                  '❌ **BLOCKED — nie przechodź jeszcze do następnego etapu.**',
                  '',
                  `Preflight PR: **${preflight}**`,
                  `Auto-merge: **${merge}**`,
                  `Pages dla scalonego commita: **${verify}**`,
                  '',
                  'Trzeba sprawdzić nieudany etap w GitHub Actions.'
                ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body
            });

            core.notice(ready ? 'READY notification posted.' : 'BLOCKED notification posted.');
